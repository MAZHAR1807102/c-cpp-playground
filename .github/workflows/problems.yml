# Refresh the Practice page's problem lists (Codeforces and CodeChef) every Monday, and on demand
# (Actions > Update practice problems > Run workflow). Commits practice-data.js only when it changed.
name: Update practice problems
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the problem lists
        run: node tools/fetch-problems.mjs
      - name: Commit the new lists
        run: |
          # the file always carries today's date; only commit when the problems themselves changed
          strip() { sed -E 's/"updated":"[0-9-]+"//'; }
          if ! diff -q <(git show HEAD:practice-data.js | strip) <(strip < practice-data.js) > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add practice-data.js
            git commit -m "Update the practice problem lists"
            git push
          else
            echo "No new problems"
          fi
