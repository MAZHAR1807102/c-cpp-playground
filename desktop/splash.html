<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playground</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* The card shown while the app starts. Same teal as the app icon; it fades out when the main window is ready. */
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; -webkit-app-region:drag}
body{display:flex; align-items:center; justify-content:center; font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.card{position:relative; width:500px; height:300px; border-radius:26px; overflow:hidden; color:#fff;
  background:linear-gradient(135deg,#0f8bad 0%,#0d6c88 45%,#0a4256 100%);
  box-shadow:0 18px 50px rgba(3,30,40,.45), inset 0 1px 0 rgba(255,255,255,.18);
  animation:enter .55s cubic-bezier(.2,.9,.25,1.15) both}
body.flat .card{border-radius:0; width:100%; height:100%}
.bar{position:absolute; left:22px; right:22px; top:18px; height:30px; border-radius:9px; background:rgba(255,255,255,.12); display:flex; align-items:center; gap:8px; padding:0 12px}
.bar i{width:11px; height:11px; border-radius:50%}
.bar i:nth-child(1){background:#f87185} .bar i:nth-child(2){background:#fbbf24} .bar i:nth-child(3){background:#4ade80}
.bar span{margin-left:auto; font:600 11px "JetBrains Mono",monospace; color:rgba(255,255,255,.65)}
.main{position:absolute; left:34px; right:30px; top:70px; display:flex; align-items:center; gap:22px}
.logo{width:92px; height:92px; flex:none; border-radius:22px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.logo svg{width:66px; height:40px}
h1{margin:0; font:800 40px/1 "Bricolage Grotesque",system-ui,sans-serif; letter-spacing:.03em; white-space:nowrap; text-shadow:0 2px 14px rgba(0,0,0,.25)}
h1 b{display:inline-block; animation:rise .5s cubic-bezier(.2,.9,.25,1.2) both}
.by{margin:8px 0 0; font:700 16px "Atkinson Hyperlegible",sans-serif; color:#86efac; letter-spacing:.04em}
.by::before{content:"— "; color:rgba(255,255,255,.5)}
.langs{position:absolute; left:34px; right:30px; top:186px; display:flex; flex-wrap:wrap; gap:6px}
.langs span{font:700 11.5px "JetBrains Mono",monospace; padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.13); color:#e6f6fb; opacity:0; animation:pop .4s ease-out forwards}
.prompt{position:absolute; left:34px; bottom:30px; right:30px; display:flex; align-items:center; gap:12px; font:700 15px "JetBrains Mono",monospace; color:#86efac}
.prompt .cur{display:inline-block; width:9px; height:16px; background:#86efac; animation:blink 1s steps(1) infinite; vertical-align:-2px; margin-left:2px}
.prompt em{font-style:normal; font-weight:600; color:rgba(255,255,255,.8); font-size:12.5px}
.load{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.12)}
.load i{position:absolute; top:0; bottom:0; width:35%; border-radius:2px; background:linear-gradient(90deg,transparent,#86efac,transparent); animation:sweep 1.25s ease-in-out infinite}
.ver{position:absolute; right:18px; bottom:14px; font:600 11px "JetBrains Mono",monospace; color:rgba(255,255,255,.55)}
.glow{position:absolute; width:260px; height:260px; right:-70px; top:-90px; border-radius:50%; background:radial-gradient(circle,rgba(134,239,172,.25),transparent 65%); animation:drift 4s ease-in-out infinite alternate}
body.out .card{animation:leave .42s ease-in forwards}
@keyframes enter{from{opacity:0; transform:scale(.92) translateY(10px)}}
@keyframes leave{to{opacity:0; transform:scale(.96) translateY(-6px)}}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
@keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes sweep{from{left:-35%} to{left:100%}}
@keyframes drift{to{transform:translate(-30px,20px)}}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important; animation-iteration-count:1!important} .langs span{opacity:1} }
</style>
</head>
<body>
<div class="card" role="img" aria-label="Playground by Mazhar is starting">
  <div class="glow"></div>
  <div class="bar"><i></i><i></i><i></i><span>playground</span></div>
  <div class="main">
    <div class="logo"><svg viewBox="150 300 724 424" aria-hidden="true"><defs><linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#4ade80"/></linearGradient></defs><g fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"><path d="M330 352 L190 512 L330 672"/><path d="M694 352 L834 512 L694 672"/></g><path d="M432 372 Q432 330 470 350 L640 486 Q672 512 640 538 L470 674 Q432 694 432 652 Z" fill="url(#pl)"/></svg></div>
    <div>
      <h1 id="title"></h1>
      <p class="by">by Mazhar</p>
    </div>
  </div>
  <div class="langs" id="langs"></div>
  <div class="prompt">&gt;_ <span><em id="msg">starting the compilers</em><span class="cur"></span></span></div>
  <div class="ver" id="ver"></div>
  <div class="load"><i></i></div>
</div>
<script>
  // the title rises letter by letter; the languages pop in one after another
  const t = 'PLAYGROUND';
  document.getElementById('title').innerHTML = [...t].map((ch, i) => `<b style="animation-delay:${0.12 + i * 0.045}s">${ch}</b>`).join('');
  document.getElementById('langs').innerHTML = ['C', 'C++', 'Java', 'Python', 'Verilog', 'Notebook'].map((l, i) => `<span style="animation-delay:${0.55 + i * 0.08}s">${l}</span>`).join('');
  const q = new URLSearchParams(location.search);
  if (q.get('v')) document.getElementById('ver').textContent = 'v' + q.get('v');
  if (q.get('flat') === '1') document.body.classList.add('flat');   // Linux: no transparent windows, so a plain rectangle
  const msgs = ['starting the compilers', 'loading the editor', 'almost ready'];
  let k = 0;
  setInterval(() => { k = Math.min(k + 1, msgs.length - 1); document.getElementById('msg').textContent = msgs[k]; }, 700);
</script>
</body>
</html>
