<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground Practice</title>
<meta name="description" content="Practise Codeforces and CodeChef problems: filter by topic and difficulty, solve in the playground, submit to the judge, and get hints.">
<script>
  try { const t = localStorage.getItem('ccp.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
:root{
  --bg:#eef2f5; --surface:#fff; --ink:#16202a; --muted:#5a6876; --line:#d3dbe3; --accent:#0a6f8c; --accent-ink:#fff; --ok:#15803d; --err:#be123c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#17202a; --ink:#e4ebf2; --muted:#93a2b1; --line:#2b3845; --accent:#4cb8d8; --accent-ink:#06222b; --ok:#4ade80; --err:#fb7185;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#17202a; --ink:#e4ebf2; --muted:#93a2b1; --line:#2b3845; --accent:#4cb8d8; --accent-ink:#06222b; --ok:#4ade80; --err:#fb7185;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif; padding:0 16px}
.top{position:sticky; top:0; z-index:20; background:var(--bg); padding:10px 0; display:flex; flex-direction:column; gap:10px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 20px}
.hright{display:flex; flex-wrap:wrap; align-items:center; gap:12px}
h1{font:800 clamp(1.4rem,2.6vw,1.9rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif; margin:0}
.byline{margin:2px 0 0; font-size:.85rem; color:var(--muted)}
label.f{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted)}
select,input[type=search]{font:14px "JetBrains Mono",monospace; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:6px 8px}
input[type=search]{width:min(260px,100%)}
.btn{font:700 .84rem "Atkinson Hyperlegible",sans-serif; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:7px; padding:5px 11px; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.filters{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px}
.frow{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{font:700 .84rem "Atkinson Hyperlegible",sans-serif; border:0; background:var(--surface); color:var(--ink); padding:6px 12px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.tags{display:flex; flex-wrap:wrap; gap:5px; max-height:66px; overflow:auto; padding:1px}
.tags.open{max-height:none}
.tag{font:600 .76rem "JetBrains Mono",monospace; border:1px solid var(--line); border-radius:999px; padding:3px 9px; background:var(--bg); color:var(--ink); cursor:pointer}
.tag[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 22%,var(--surface)); border-color:var(--accent); color:var(--accent)}
.tag small{color:var(--muted); font-weight:400}
.count{color:var(--muted); font-size:.88rem; margin-left:auto}
.list{max-width:1300px; margin:6px auto 40px; display:flex; flex-direction:column; gap:8px}
.prob{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 12px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 12px; align-items:center}
.prob.done{border-left:4px solid var(--ok)}
.judge{font:800 .72rem "JetBrains Mono",monospace; letter-spacing:.04em; padding:4px 7px; border-radius:6px; color:#fff; text-align:center; min-width:34px}
.judge.cf{background:#1f6fb2} .judge.cc{background:#7b4b2a}
.pname{min-width:0}
.pname a{font-weight:700; color:var(--ink); text-decoration:none}
.pname a:hover{color:var(--accent)}
.pname .pid{font:700 .82rem "JetBrains Mono",monospace; color:var(--muted); margin-right:6px}
.meta{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-top:3px; font-size:.78rem; color:var(--muted)}
.meta .t{font:600 .72rem "JetBrains Mono",monospace; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:1px 7px; color:var(--ink); cursor:pointer}
.rating{font:800 .78rem "JetBrains Mono",monospace; padding:2px 8px; border-radius:999px; border:1.5px solid currentColor}
.acts{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
.acts .btn{padding:5px 10px; font-size:.8rem}
.acts .mark[aria-pressed="true"]{color:var(--ok); border-color:var(--ok)}
.more{align-self:center; margin:6px 0}
.empty{color:var(--muted); text-align:center; padding:30px}
.note{max-width:1300px; margin:0 auto; color:var(--muted); font-size:.82rem}
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:9px; font-size:.9rem; z-index:70; max-width:min(560px,90vw); box-shadow:0 8px 24px rgba(0,0,0,.25)}
dialog.pick{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:18px 20px; width:min(420px,calc(100vw - 32px))}
dialog.pick::backdrop{background:rgba(0,0,0,.5)}
dialog.pick h3{margin:0 0 6px; font:800 1.15rem "Bricolage Grotesque",system-ui,sans-serif}
dialog.pick p{margin:0 0 12px; color:var(--muted); font-size:.9rem}
dialog.pick .langs{display:flex; gap:8px; flex-wrap:wrap}
.exammsg{color:var(--muted); padding:30px; text-align:center}
@media (max-width:760px){ .prob{grid-template-columns:auto minmax(0,1fr)} .acts{grid-column:1/-1; justify-content:flex-start} .top{position:static} }
</style>
</head>
<body data-page="practice">
<div class="top">
  <header>
    <div class="brand">
      <h1>Playground</h1>
      <p class="byline">by MAZHAR</p>
    </div>
    <div class="hright">
      <nav id="modes"></nav>
      <label class="f" title="Colours of the page">Theme <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
  </header>
  <section class="filters" id="filters" aria-label="Filters">
    <div class="frow">
      <div class="seg" role="group" aria-label="Online judge"><button type="button" data-j="all" aria-pressed="true">All judges</button><button type="button" data-j="cf">Codeforces</button><button type="button" data-j="cc">CodeChef</button></div>
      <input type="search" id="q" placeholder="Search name or ID, e.g. 4A" aria-label="Search problems" autocomplete="off" spellcheck="false">
      <label class="f">Difficulty <select id="rmin" aria-label="Lowest difficulty"></select> to <select id="rmax" aria-label="Highest difficulty"></select></label>
      <label class="f">Sort <select id="sort"><option value="solved">Most solved first</option><option value="easy">Easiest first</option><option value="hard">Hardest first</option><option value="new">Newest first</option><option value="random">Shuffle</option></select></label>
      <label class="f"><input type="checkbox" id="hideDone"> Hide solved</label>
      <span class="count" id="count"></span>
    </div>
    <div class="frow">
      <span class="f" style="color:var(--muted);font-size:.85rem">Topics</span>
      <div class="tags" id="tags"></div>
      <button class="btn" type="button" id="moreTags">All topics</button>
      <button class="btn" type="button" id="clear">Clear filters</button>
    </div>
  </section>
</div>
<p class="note" id="note"></p>
<main class="list" id="list" aria-live="polite"></main>

<dialog class="pick" id="pick" aria-labelledby="pickTitle">
  <h3 id="pickTitle">Solve in the editor</h3>
  <p id="pickText">Choose a language. The editor opens with a starting program, and the problem stays pinned above it with its links, hints and Submit.</p>
  <div class="langs"><button class="btn primary" data-l="cpp">C++</button><button class="btn" data-l="c">C</button><button class="btn" data-l="java">Java</button><button class="btn" data-l="python">Python</button><button class="btn" data-close style="margin-left:auto">Cancel</button></div>
</dialog>

<script src="practice-data.js"></script>
<script src="practice-hints.js"></script>
<script src="shell.js"></script>
<script src="practice.js"></script>
</body>
</html>
