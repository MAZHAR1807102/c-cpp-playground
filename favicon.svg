<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Playground app icon: code brackets around a play button (write code, run it). Not tied to one language. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a0c4"/>
      <stop offset="0.5" stop-color="#0d6c88"/>
      <stop offset="1" stop-color="#083a4c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021a22" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#021a22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shine)"/>
  <!-- the brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M330 352 L190 512 L330 672"/>
    <path d="M694 352 L834 512 L694 672"/>
  </g>
  <!-- the play button -->
  <path d="M432 372 Q432 330 470 350 L640 486 Q672 512 640 538 L470 674 Q432 694 432 652 Z" fill="url(#play)" filter="url(#soft)"/>
</svg>
